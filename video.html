<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZHERO69</title>

    <link rel="icon" href="/fotos/icon.png" type="image/png">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Montserrat', sans-serif;
            overflow:hidden;
            min-height:100vh;
        }

        /* FUNDO */

        #fundo{
            position:fixed;
            inset:0;

            background:url('/fotos/fundo.png');
            background-size:cover;
            background-position:center;

            z-index:-3;
        }

        /* CORAÇÕES */

        .hearts{
            position:fixed;
            inset:0;

            pointer-events:none;

            overflow:hidden;

            z-index:-1;
        }

        .heart{
            position:absolute;

            bottom:-50px;

            color:rgba(255,255,255,0.6);

            font-size:18px;

            animation:subir linear infinite;
        }

        @keyframes subir{

            0%{
                transform:translateY(0) scale(1);
                opacity:0;
            }

            10%{
                opacity:1;
            }

            100%{
                transform:translateY(-120vh) scale(1.4);
                opacity:0;
            }
        }

        /* POSIÇÕES */

        .heart:nth-child(1){
            left:3%;
            animation-duration:9s;
            animation-delay:0s;
        }

        .heart:nth-child(2){
            left:8%;
            animation-duration:12s;
            animation-delay:2s;
        }

        .heart:nth-child(3){
            left:15%;
            animation-duration:10s;
            animation-delay:4s;
        }

        .heart:nth-child(4){
            right:3%;
            animation-duration:11s;
            animation-delay:1s;
        }

        .heart:nth-child(5){
            right:10%;
            animation-duration:8s;
            animation-delay:3s;
        }

        .heart:nth-child(6){
            right:16%;
            animation-duration:13s;
            animation-delay:5s;
        }

        /* CONTAINER */

        .container{
            width:100%;
            min-height:100vh;

            display:flex;
            flex-direction:column;

            justify-content:center;
            align-items:center;

            padding:40px;

            position:relative;
            z-index:2;
        }

        /* CARD */

        .texto-container{

            width:100%;
            max-width:700px;

            display:flex;
            flex-direction:column;
            align-items:center;

            padding:30px;

            border-radius:24px;

            background:rgba(0,0,0,0.25);

            backdrop-filter:blur(15px);

            box-shadow:0 20px 40px rgba(0,0,0,0.35);

            animation:fadeUp 1s ease;
        }

        /* VIDEO */

        .video-container{
            width:100%;

            display:flex;
            justify-content:center;
            align-items:center;
        }

        .videoFrame{

            width:1000px;
            height:620px;

            border:none;

            border-radius:20px;

            overflow:hidden;

            background:transparent;
        }

        /* BOTÃO */

        .voltar{

            display:inline-block;

            margin-top:25px;

            text-decoration:none;

            color:#313f5f;

            font-size:18px;

            letter-spacing:3px;

            transition:0.3s;
        }

        .voltar:hover{
            opacity:0.7;
            transform:scale(1.05);
        }

        /* ANIMAÇÃO */

        @keyframes fadeUp{

            from{
                opacity:0;
                transform:translateY(30px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        /* RESPONSIVO */

        @media(max-width:768px){

            .container{
                padding:20px;
            }

            .texto-container{
                padding:20px;
            }

            .videoFrame{
                width:100%;
                max-width:350px;
                height:620px;
            }
        }

    </style>
</head>

<body>

    <div id="fundo"></div>

    <!-- CORAÇÕES -->

    <div class="hearts">

        <div class="heart">♡</div>
        <div class="heart">♥</div>
        <div class="heart">♡</div>

        <div class="heart">♥</div>
        <div class="heart">♡</div>
        <div class="heart">♥</div>

    </div>

    <div class="container">

        <div class="texto-container">

            <div class="video-container">

                <iframe
                    src="https://www.tiktok.com/embed/v3/7637636256544951573"
                    class="videoFrame"
                    allowfullscreen>
                </iframe>

            </div>

        </div>

        <a href="index.html" class="voltar">
            VOLTAR
        </a>

    </div>

</body>

</html>
